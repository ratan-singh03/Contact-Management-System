<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Contacts</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
    <div class="brand">Contact Management</div>
    <nav>
        <a href="/">Contact Form</a>
        <a href="/contacts.html">View Contacts</a>
    </nav>
</header>

<main class="page">
    <section class="card table-card">
        <div class="heading-row">
            <div>
                <h1>Saved Contacts</h1>
                <p class="subtitle">All submitted contact messages.</p>
            </div>
            <button id="refreshBtn" class="secondary">Refresh</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Message</th>
                </tr>
                </thead>
                <tbody id="contactTableBody"></tbody>
            </table>
        </div>

        <p id="tableStatus" class="status"></p>
    </section>
</main>

<script src="/js/contacts.js"></script>
</body>
</html>
